# main에 푸시하거나 머지하면 화면과 서버를 jar 하나로 빌드하고, 도커 이미지로 만들어 학교 서버에 배포한다.
# (PR이 머지되기 전까지는 작업 브랜치에 올릴 때도 배포한다)
# 필요한 Secrets: DB_ADDRESS, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD,
#                SSH_ADDRESS, SSH_ID, SSH_PASSWORD, SSH_PORT
# 있으면 카카오 로그인도 켬: KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET
# 있으면 구글 로그인도 켬: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# 있으면 깃허브 로그인도 켬: GH_CLIENT_ID, GH_CLIENT_SECRET (Secrets 이름은 GITHUB_ 로 시작할 수 없음)
# 있으면 관리자(아이디 admin) 비밀번호로 씀: ADMIN_PASSWORD
# 블로그 포트는 Variables의 APP_PORT. 정하기 전에는 배포하지 않는다 (서버를 여럿이 같이 써서 포트가 겹치면 안 됨)
# 롤링 배포용 두 번째 블로그 포트는 Variables의 APP_PORT_2 (없으면 APP_PORT + 1)
name: deploy

on:
  push:
    branches: [main, claude/speckit-spec-ylybrs]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.APP_PORT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 화면 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 화면을 서버 jar 안에 넣기
        run: |
          rm -rf backend/src/main/resources/static
          cp -r frontend/dist backend/src/main/resources/static

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 서버 빌드와 테스트
        working-directory: backend
        run: |
          mvn -B package
          cp target/backend-0.0.1-SNAPSHOT.jar ../deploy/app.jar

      - name: 도커 이미지 만들기
        run: |
          docker build -t seohyun-blog:latest .
          docker save seohyun-blog:latest | gzip > deploy/seohyun-blog.tar.gz

      - name: 서버로 파일 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: deploy/seohyun-blog.tar.gz,deploy/deploy.sh
          target: blog-dock
          strip_components: 1

      - name: 서버에서 블로그 두 개를 하나씩 바꾸기 (롤링 배포)
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          APP_PORT_2: ${{ vars.APP_PORT_2 }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_PORT,APP_PORT_2,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GH_CLIENT_ID,GH_CLIENT_SECRET,ADMIN_PASSWORD
          command_timeout: 10m
          script: |
            chmod +x ~/blog-dock/deploy.sh
            ~/blog-dock/deploy.sh
