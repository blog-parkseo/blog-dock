# 푸시·PR마다 SonarQube Cloud로 코드를 검사한다 (버그, 보안 약점, 중복, 테스트 커버리지).
# 필요한 Secret: SONAR_TOKEN (SonarQube Cloud > My Account > Security 에서 만든 토큰). 없으면 검사를 건너뛴다.
# SonarQube Cloud 프로젝트의 Automatic Analysis 는 꺼 둔다 (같이 켜져 있으면 검사가 실패한다).
name: sonar

on:
  push:
    branches: [main, claude/speckit-spec-ylybrs]
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 바뀐 줄을 누가 언제 바꿨는지 알려면 전체 기록이 필요하다

      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 서버 빌드·테스트·커버리지
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: mvn -B verify

      - name: SonarQube Cloud 검사
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

      - name: 토큰이 없어서 건너뜀
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN Secret이 없어서 검사를 건너뛰었어요."
