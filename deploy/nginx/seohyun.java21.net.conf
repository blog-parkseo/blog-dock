# seohyun.java21.net 으로 들어오면 서버의 블로그 컨테이너(8380)로 넘겨주는 nginx 설정.
# 학교 서버의 nginx 설정 폴더(예: /etc/nginx/conf.d)에 넣고 nginx를 다시 읽으면 된다 (관리자 권한 필요).
server {
    listen 80;
    server_name seohyun.java21.net;

    access_log /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.error.log;

    # 글에 넣는 이미지는 최대 10MB
    client_max_body_size 12m;

    location / {
        proxy_pass http://10.116.64.12:8380;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
