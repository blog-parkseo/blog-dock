# seohyun.java21.net 으로 들어오면 블로그 컨테이너(8380)로 넘겨주는 nginx 설정 (수업 가이드 형식).
# 서버의 ~/nginx/seohyun.java21.net.conf 에 두고 강사님께 파일 이름을 알려 적용을 요청한다.
server {
    listen 80;
    server_name seohyun.java21.net;

    access_log /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8380;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
