# seohyun.java21.net 으로 들어오면 블로그 컨테이너로 넘겨주는 nginx 설정 (수업 가이드 형식).
# 서버의 ~/nginx/seohyun.java21.net.conf 에 둔다.
#
# 롤링 배포: 블로그가 두 개(8380, 8381) 떠 있어서 손님을 번갈아 보낸다.
# 배포할 때 하나씩 꺼지는데, 꺼진 쪽으로 간 요청은 nginx가 바로 다른 쪽으로 다시 보낸다.
#
# https: "managed by Certbot" 줄은 강사님이 Certbot으로 받은 인증서 설정이다. 지우면 https 경고가 뜬다.
upstream seohyun_blog {
    server 127.0.0.1:8380 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8381 max_fails=1 fail_timeout=10s;
}

server {
    server_name seohyun.java21.net;
    access_log /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_009/nginx/logs/seohyun.java21.net.error.log;
    client_max_body_size 20M;

    location / {
        proxy_pass http://seohyun_blog;

        # 한쪽 블로그가 꺼져 있거나 켜지는 중이면 다른 쪽으로 다시 보낸다.
        # 꺼진 블로그는 요청을 아예 받지 못하므로 글쓰기(POST)도 다시 보내도 두 번 저장되지 않는다
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/seohyun.java21.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seohyun.java21.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = seohyun.java21.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name seohyun.java21.net;
    return 404; # managed by Certbot
}
