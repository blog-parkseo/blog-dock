# 운영: SPRING_PROFILES_ACTIVE=prod,kakao (서브도메인을 쓰면 subdomain 도 추가)
# MySQL을 쓴다. 아이디·비밀번호로 로그인하고, 닉네임 로그인은 꺼져 있다. 접속 정보는 환경 변수로 넣는다.
# DB_ADDRESS·DB_PORT·DB_NAME·DB_USERNAME·DB_PASSWORD (Crowfoot 데이터베이스 탭의 값)
spring:
  datasource:
    url: jdbc:mysql://${DB_ADDRESS}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false

server:
  # nginx 뒤에서 돈다. nginx가 보내는 X-Forwarded-Proto(https)를 믿어서
  # 카카오 로그인 Redirect URI 같은 주소를 https://seohyun.java21.net/... 으로 만든다
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # https로 열 때는 COOKIE_SECURE=true
        secure: ${COOKIE_SECURE:false}

blogdock:
  upload-dir: ${UPLOAD_DIR:/var/blogdock/uploads}
  # 관리자(아이디 admin) 비밀번호. GitHub Secret ADMIN_PASSWORD로 넣는다. 없으면 관리자는 로그인할 수 없다
  admin-password: ${ADMIN_PASSWORD:}
  dev-login:
    # 닉네임만 치는 로그인. 아이디·비밀번호 로그인이 생겨서 운영에서는 끈다. 켜려면 DEV_LOGIN=true
    enabled: ${DEV_LOGIN:false}
    # 운영에서는 아무나 관리자(admin)로 들어오지 못하게 막는다
    admin: false
