spring:
  datasource:
    url: jdbc:h2:file:./data/blogdock;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        max-age: 14d
        http-only: true
        same-site: lax
