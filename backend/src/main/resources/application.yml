spring:
  datasource:
    url: jdbc:h2:file:./data/blogdock;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # 이미지 한 장 10MB (공통 정책 5). 여유를 조금 둔다
      max-file-size: 11MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        max-age: 14d
        http-only: true
        same-site: lax

blogdock:
  # 올린 이미지를 저장할 폴더
  upload-dir: ./uploads
  # 관리자(아이디 admin) 비밀번호. 내 맥에서 연습할 때만 쓰는 값이고, 운영은 ADMIN_PASSWORD로 따로 넣는다
  admin-password: admin1234
